name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
          python -m pip check
      - name: Validate safe configuration templates
        run: python -c "import json, pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in map(pathlib.Path, ('Data/config.example.json', 'Data/roles.example.json'))]"
      - name: Create local runtime configuration
        run: python -c "import shutil; shutil.copyfile('Data/config.example.json', 'Data/config.json'); shutil.copyfile('Data/roles.example.json', 'Data/roles.json')"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Lint runtime-breaking errors
        run: ruff check . --select E9,F63,F7,F82
      - name: Run tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v
      - name: Check bot installation offline
        env:
          PYTHONUTF8: "1"
        run: python bot.py --check
      - name: Parse PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path setup.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path start.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
